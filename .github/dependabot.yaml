version: 2

# Library modules are left out: a dependency bump there needs a VERSION bump,
# which Dependabot can't make.
updates:
  # "/" covers .github/workflows; local composite actions are listed too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Conventional Commits titles (openspec/config.yaml): ci(deps): bump ...
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /tools/release
    # Direct dependencies only, plus gorelease's module: it's required
    # only by a tool directive, so go.mod marks it // indirect. Its entry
    # names the type too, since GitHub defaults a missing one to direct.
    allow:
      - dependency-type: direct
      - dependency-name: golang.org/x/exp
        dependency-type: all
    schedule:
      interval: weekly
    # Conventional Commits titles (openspec/config.yaml): build(deps): bump ...
    commit-message:
      prefix: build
      include: scope
