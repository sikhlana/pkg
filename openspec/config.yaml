schema: spec-driven

context: |
  Repo: github.com/sikhlana/pkg, a public, personal library of
  reusable Go modules built around Uber fx. Each subdirectory with its
  own go.mod is an independently versioned module; there is no root
  go.mod. A committed root go.work ties the modules together for local
  development. This block is the constitution: CLAUDE.md and README.md
  point here rather than restating it.

  Principles:
  - fx-first, not fx-only. Every stateful module integrates with fx,
    and every constructor also works without it: Params is a plain
    struct a caller can fill in by hand.
  - The Module is the API. Consumers compose an app by listing module
    identifiers, not by wiring constructors, so internal wiring can
    change without breaking them.
  - Operator config and developer wiring are different inputs and
    reach a constructor by different routes (see below).
  - Providing a loop is not running it. A module that owns a
    long-running loop provides it; the app opts in to running it.
  - Small modules, small dependency trees. Importing one module never
    drags in another's dependencies.
  - Solved, fiddly problems use a maintained library or the vendor's
    SDK, not hand-rolled code.

  Versioning and releases:
  - Modules are tagged <module>/v<version>; nested modules keep their
    path (http/httpserver/v0.2.0). CI creates the tag and GitHub release
    on merge to main. Never tag by hand.
  - Each module has a VERSION file holding its semver. Every PR that
    changes a module's files bumps that module's VERSION, including
    test-only, README, godoc and example edits, and compile fixes
    forced by a sibling's API change.
  - Patch: fixes, refactors, patch-level dependency updates, docs and
    tests. Minor: new exports, and a go.mod that raises a requirement
    to a higher minor or major, or raises the go directive, which
    gorelease's floor demands even when the API is unchanged. Major:
    breaking changes once a module is 1.0. Pre-1.0, breaking changes
    take a minor bump; 1.0 is a deliberate stability call, not a way
    to earn majors.
  - CI enforces a floor: VERSION must be at least the version gorelease
    suggests from the exported-API diff and the go.mod changes against
    the module's last release. The author can go higher (a behaviour
    change behind an unchanged API), never lower.
  - A module's path is the repo path followed by its directory. A major
    past v1 therefore lives in a new <dir>/vN directory with module path
    <repo>/<dir>/vN (semantic import versioning), a new import path for
    every consumer; it's tagged <dir>/vN.x.y, as the go command expects.
    Treat it as a last resort; prefer additive change.
  - A new module starts at 0.1.0 (N.0.0 in a <dir>/vN directory), and
    merging it publishes it. Later PRs bump it like any other module.
    A removed module that comes back continues above its last release.
  - No replace directives in go.mod. go.work is committed; go.work.sum
    is not. Before merge, every go.mod requires published versions of
    its siblings, so interdependent modules release in dependency
    order, one PR per tier.
  - Every go.mod and go.work declares the Go language version in
    .go-version at the repo root; a patch release (go 1.27.1) is fine
    when a dependency forces one.
  - The repo is MIT-licensed through a single root file named exactly
    LICENSE. go copies that file, by that name only, into every nested
    module's zip, and pkg.go.dev needs it there. Modules don't carry
    their own copy.
  - tools/ holds repo tooling, not library modules. A tool has its own
    go.mod, sits outside go.work and runs with GOWORK=off; it has no
    VERSION and is never released. The code and test standards apply
    to it; the module layout, README and spec rules don't.

  Commits and pull requests:
  - Commit messages and pull request titles follow Conventional
    Commits 1.0: <type>(<scope>)!: <description>. Squash merges put
    the pull request title on main as the commit subject, with the
    pull request body as its message, so the title is what lasts and
    CI checks it. Branch commits follow the same form.
  - Types: feat, fix, perf, refactor, test, docs, build (go.mod and
    dependencies), ci (workflows and tools/release), chore, revert.
  - The scope is the package name of the one module a change touches
    (cli, httpserver), the directory of the one tool (tools/release), or
    openspec for a spec-only change. Leave it out when a change spans
    several.
  - ! marks a breaking change to a module's exported API at any
    version, even before 1.0, where it takes only a minor bump.
  - The description is lowercase and imperative, with no trailing
    period: "feat(cli): add Main and CommandFunc".
  - The type never sets a version. VERSION and the gorelease floor do,
    so a feat that adds exports still bumps VERSION by hand.

  fx integration:
  - A package that owns state, runs work, or wires services exports an
    fx.Module variable named exactly Module. Utility packages, pure
    function primitives and testing/<module>test doubles don't. The
    exceptions: config/configloader, whose provider is generic over the
    app's config type, so it's a function, Provide[T], not a variable;
    and kernelrun and kernel, which build and run the app rather than
    join its graph.
  - fx.Module names are the module's package name ("log",
    "configloader"). A package inside a module, below its root, uses
    its path in the repo instead ("telemetry/trace"), so its fx logs
    and tags can't collide with a same-named package elsewhere.
  - Every constructor registered with fx.Provide takes a single Params
    struct embedding fx.In, even for one dependency. Name it Params, or
    by purpose (PublisherParams) when a module has several. The
    fx.Lifecycle field is named Lifecycle. Optional dependencies use
    `optional:"true"`. The one exception: a constructor whose tags
    depend on an instance name given at wiring time can't carry them
    in struct tags, so it takes positional parameters annotated with
    fx.ParamTags.
  - Name tags are name:"<module>:<purpose>:<name>", where <module> is
    the fx.Module name, as in group tags below. An exported helper
    (ConfigNameTag(name)) builds them so callers never format them.
    Group tags are group:"<module>:<purpose>", exposed as an exported
    constant. A new group ships the constant, a typed ProvideX helper
    that tags the caller's constructor, and a collector that takes the
    group via fx.In.
    A group keyed by an instance name (one middleware group per named
    server) can't be a constant: it's group:"<module>:<purpose>:<name>",
    exposed as a function returning the tag (MiddlewareGroup(name)),
    beside its ProvideX(name, ...) helper and its collector.
  - A helper whose caller's constructor may need a tag built at wiring
    time, because it registers into another module's machinery
    (kernelrun.ProvideRunner) or builds named instances
    (httpserver.ProvideServer), takes anns ...fx.Annotation after its
    other parameters and passes them to fx.Annotate after its own, so
    such a constructor still goes through the helper. They're for the
    constructor's inputs and hooks (fx.ParamTags, fx.From, fx.OnStart,
    fx.OnStop); one that repeats what the helper sets fails startup
    with fx's error, and the godoc says so. A helper that annotates a
    value or a constructor with fixed dependencies (AsX) doesn't take
    them: an fx.In struct with static tags covers that.
  - A helper that builds named instances builds each one itself,
    through the module's Provider, passing the name as an option; it
    never decorates the Provider.
  - A segment naming an action done to the value (built, wired,
    supplied) is separated by a double colon:
    name:"<module>:<purpose>::<action>" (name:"kernelrun:runner::built",
    name:"telemetry/trace:provider::supplied"). Instance names can't
    contain ":", so such a tag can't collide with one built from an
    instance name.
  - Instance names (a named server) are non-empty and limited to
    letters, digits, "-", "_" and ".", so they read cleanly in tags,
    runner names and logs. Every helper that takes one checks it, and
    an invalid name fails startup through fx.Error with an exported
    ErrInvalidName.

  Choosing how to expose a type (one shape per type):
  1. Singleton: fx.Provide(New) when one instance per app suffices.
  2. Provider: a function type that takes a Config and returns a
     client, for the same kind of client built per config (several
     accounts, hosts, queues). Suffix Provider, never Factory. Not for
     middleware or decorator shapes (func(http.Handler) http.Handler);
     those are named for what they wrap.
  3. Mode-dispatching constructor: Config.Mode picks one of several
     implementations of an interface. The implementations stay
     exported and directly constructible.
  4. Plain function: stateless helpers, no fx involvement.

  Config vs developer-time wiring:
  - If an operator could change a value by editing config and
    restarting, it's a Config field; otherwise it's developer wiring.
    Borderline knobs start as wiring: promoting one to Config later is
    cheap, demoting is not.
  - Config fields carry mapstructure snake_case tags. config.go holds
    only operator config, never structural values like component name
    or version.
  - A Config never has both x and x_file, since config/configloader
    reads X_FILE as a file holding X and the two env names would
    collide.
  - A *_file field names a file the module reads itself and may
    re-read, a live counterpart to configloader's _FILE. A *_path
    field is a path used as a path (a socket, a directory). A
    credential that rotates belongs in a *_file field.
  - Operator config reaches a module through configloader, with one
    exception: telemetry also honours OpenTelemetry's OTEL_*
    environment variables, below its Config, because operators and the
    OpenTelemetry ecosystem expect them to work. No other module reads
    the environment itself.
  - Developer wiring (loggers, HTTP clients, callbacks, component
    names) is a typed fx value with a pair of helpers: AsX annotates a
    value or a constructor, WithX(v) wraps fx.Supply(AsX(v)). Ship both
    halves.
  - Where zero means "unset", pair an exported Default* constant with
    an unexported resolver method on Config. Don't where zero is a
    legitimate value.
  - Validate tags check value shape and presence (required, url,
    oneof). A mode-dispatching Config marks each mode-specific field
    validate:"-", so the tag pass never reaches a dormant struct, and
    its Validate() error method delegates to the active one with
    configvalidator.ValidateField, returning the result directly or
    joined. Cross-field invariants go in Validate() too, returning
    exported sentinels. Config is validated once where it's loaded;
    Provider closures validate the Config they're handed; fx-wired
    constructors trust their input.

  Run loops and cross-module integration:
  - A long-running loop (server, receiver, poller) is split: Module
    provides the implementation, and a separate ProvideRunner in
    runner.go, with a DefaultRunnerName constant, opts it in to
    running. Shared infrastructure lists the Module; only the commands
    that need the loop list ProvideRunner. It registers through
    kernelrun.ProvideRunner under DefaultRunnerName.
  - A module whose loops are named instances (several servers) has
    no DefaultRunnerName: ProvideRunner(name) opts one instance in and
    registers it as <module>:<name>, so an instance name can't collide
    with another module's runner.
  - A loop module prepares in OnStart (binding a listener, opening a
    subscription), serves in its runner until the runner's context is
    cancelled, and releases in OnStop what OnStart acquired. A setup
    failure is then a startup failure, and a finished Start means
    ready.
  - A module doesn't import a sibling just to integrate with it. It
    exposes a value (a check func, a handler) and the consuming app
    wires the integration.
  - Modules take trace.TracerProvider and
    propagation.TextMapPropagator (and, later, metric.MeterProvider)
    by injection, never from OpenTelemetry's globals. Only
    telemetry.InstallGlobals sets the globals, for third-party code
    that can only read them.
  - An integration that pulls a heavy dependency lives in a subpackage
    (<module>/<integration>) so consumers that don't import it don't
    build it.

  Code standards:
  - Constructors don't repeat the package name: log.New, not
    log.NewLogger. Use New<Type> only when a package has several
    principal types.
  - Receivers: values for small immutable structs (configs, tokens);
    pointers when a method mutates, the struct is large, or it holds a
    mutex or channel. Error types take pointer receivers even when
    small and immutable, so errors.AsType has a single target; a slice
    of errors (configvalidator.Errors) takes value receivers instead,
    as go/scanner.ErrorList does, so callers range over it directly.
    Never mix receivers on one type, with one exception: decode
    methods (UnmarshalText, UnmarshalJSON and the like) take a pointer
    receiver on a type whose other methods take values, as slog.Level
    does, so its constants still satisfy encoding.TextMarshaler.
  - Errors: lowercase, no trailing period (staticcheck's ST1005). A
    wrap names the operation in progress as a gerund and adds only
    what the callee doesn't already report ("loading key pair %s: %w"),
    never "failed to" or "error"; detail the wrapped error lacks, such
    as a command's stderr, follows it ("running git %s: %w: %s"). A
    sentinel carrying detail comes first ("%w: %q"). Sentinel and leaf
    messages are noun phrases or claims ("invalid version"). A panic
    message starts with its package and function, as the standard
    library's do ("configvalidator: ValidateField: ..."), since no
    caller adds context to it. Documented failure modes are exported
    sentinels checked with errors.Is. Every sentinel is an exported
    Err* variable, even one that only a log record or a wrapped error
    carries today, so a caller can always match it; package main is
    exempt, since nothing can import it. Use errors.AsType[T], not
    errors.As.
  - Modules log through an injected *slog.Logger, never through the
    standard library's slog or log package-level functions.
  - Logging calls pass typed attributes (slog.String, slog.Int,
    slog.Duration, slog.GroupAttrs), never key-value pairs, with
    slog.Any only where no typed constructor fits.
  - Godoc every exported symbol, minimally: start with the name, say
    what it does and any non-obvious behaviour (concurrency, side
    effects, error semantics). Don't restate the signature.
  - Comments don't narrate changes ("added X", "fix for Y", "used by
    Z"); that belongs in the PR. Inline comments explain a non-obvious
    why, nothing else.
  - No internal/ directories. These are libraries; everything is
    exported by design.
  - Interface-satisfaction checks (var _ Iface = T{}) go in _test.go
    files.
  - Empty lines split a function body into its logical operations:
    each one has an empty line before and after it, except at the
    start or end of a block. Every block statement (if, for, switch,
    select, and so on) has an empty line before and after it, too. Two
    exceptions: an `if err != nil` stays directly under the call that
    returned the error it checks, and a defer stays directly under the
    statement that acquired what it releases (ctx, cancel := ...;
    defer cancel()).
  - Don't hand-fix formatting; golangci-lint --fix owns it.

  Testing:
  - Every failure goes through testify: require.* to stop, assert.* to
    continue. Never t.Fatal, t.Fatalf, t.Error, t.Errorf, t.Fail or
    t.FailNow. Orchestration helpers (t.Helper, t.Run, t.Cleanup,
    t.Context, t.TempDir, t.Setenv) are fine.
  - Use t.Context(), not context.Background(), and t.Helper() in
    helpers. Servers bind 127.0.0.1:0, never a fixed port.
  - fx tests run the real Module under fxtest.New, with fx.Supply for
    its dependencies; not hand-rewired fx.Provide or fx.Annotate.
    Direct construction fills Params by hand, with
    fxtest.NewLifecycle(t) for Lifecycle.
  - Mocks are gomock, generated by mockgen from a //go:generate
    directive beside the interface it mocks, and committed. Run
    go generate ./... after changing a mocked interface. mockgen comes
    from PATH, never go run …@latest.
  - Doubles that consumers need (spies, in-memory fakes) live in
    testing/<module>test, each its own module, as the standard
    library's testing/slogtest does. A module's own tests never import
    its double: each go.mod would require the other, and neither could
    release first.
  - Fixture helpers that marshal panic on error, or take *testing.T and
    require.NoError; never discard the error.
  - Tests that need external services or run long skip under -short.

  Tooling:
  - Toolchains (go, golangci-lint, modernize, mockgen, govulncheck) run
    directly; this repo doesn't wrap them in Docker. govulncheck's
    version is pinned by a tool directive in tools/release/go.mod, which
    CI builds it from.
  - Prefer a lint ban to a written rule. When a rule here reads "use X,
    not Y" and Y is a symbol, .golangci.yml bans Y through a dedicated
    linter where one exists, otherwise forbidigo with a message naming
    X. From this block: the t.Fatal family (testify), errors.As
    (errors.AsType), context.Background and context.TODO in tests
    (t.Context), package-level calls in the standard library's slog
    and log packages (an injected *slog.Logger), and key-value pairs in
    logging calls (typed attributes, through sloglint's attr-only).
    fx.Shutdowner is banned too: kernelrun.Run never listens for it,
    and returning from a runner already ends the app. So are
    OpenTelemetry's global getters (otel.Tracer, otel.Meter,
    otel.GetTracerProvider, otel.GetMeterProvider,
    otel.GetTextMapPropagator), for injection, and its global setters
    (otel.SetTracerProvider, otel.SetMeterProvider,
    otel.SetTextMapPropagator), for telemetry.InstallGlobals.
    wsl_v5 enforces the empty-line rule: its default
    checks plus empty lines after blocks, with nothing cuddled above a
    block. A defer sharing a variable with the line above is let back
    in by an exclusion on wsl_v5's "too many statements above defer"
    report.
  - golangci-lint runs from a module's directory and picks up the root
    .golangci.yml by walking up.
  - Verification, in order. On each touched module: modernize -fix,
    then golangci-lint run --fix (and again without --fix if it changed
    files; the no-fix run is the source of truth), then the full
    go test ./... , then govulncheck ./... . Then go test -short ./...
    across every module.

  Module layout:
    mymodule/
    ├── go.mod, VERSION, README.md    required
    ├── mymodule.go                   the entry point (New, Run, Load)
    │                                 or the package doc
    ├── config.go                     when the module has a Config
    ├── <idea>.go                     one per principal idea, with its
    │                                 ProvideX/WithX/AsX (server.go)
    ├── errors.go                     every sentinel error
    ├── module.go                     Module, helpers of ideas too
    │                                 small for a file, shared wiring
    ├── runner.go                     when it owns a long-running loop
    └── <file>_test.go                tests follow the file they test
    testing/mymoduletest/             optional consumer-facing doubles,
                                      a module of its own

  - A package splits into one file per principal idea, named for it
    (server.go, provider.go, options.go, middleware.go), so no file
    collects unrelated types. <package>.go holds the package's entry
    point (New, Run, Load) or only its doc; a package of one small
    idea may stay in that one file.
  - An idea's fx helpers live with it: when x.go exists, its ProvideX,
    WithX, AsX and tag helper go there too (ProvideServer and NameTag
    in server.go, AsFormat in format.go, ProvideRunner and WithRunner
    in runner.go). An idea too small for its own file has its helpers
    in module.go (log's AsDebug, configloader's AsFilename). module.go
    otherwise holds the Module variable and wiring that spans ideas,
    such as a check the Module runs. A Params struct stays beside its
    constructor.
  - Every sentinel error (an exported Err* variable) lives in
    errors.go, so a package's failure modes are listed in one place
    and an error doesn't move when a second idea starts using it. An
    error type that is an idea of its own (configvalidator.Error)
    lives there too. A package that is a single file keeps its
    sentinels in it.
  - Tests follow the file they test: x_test.go for x.go, and
    errors.go's sentinels are tested where they're returned.
    helpers_test.go and export_test.go hold shared test plumbing, and
    a test that drives the package through its entry point and checks
    behaviour spanning several files (an end-to-end run) stays in
    <package>_test.go. A platform-specific test takes the file's name
    and the platform suffix (tint_unix_test.go).
  - A nested module lives at <group>/<group><name> (config/configloader,
    http/httpserver), and its package name equals its directory name.
    Outside the filesystem path and the tag, which the go command
    needs, the package name is the module's identity: its fx.Module
    name, the <module> segment of its name and group tags, its spec
    folder and its commit scope.
  - A group directory may itself be a module (telemetry). Packages
    inside a module are named for their role (telemetry/trace,
    telemetry/trace/otlpgrpc), not <group><name>; the
    <group>/<group><name> rule is for nested modules. Such a package
    takes its repo path as its fx.Module name and tag prefix, and
    shares its module's spec and commit scope.
  - Consumer-facing doubles are the one exception to
    <group>/<group><name>: they live at testing/<module>test
    (testing/logtest), and their package name still equals their
    directory name.

  Documentation:
  - A module README has, in order: title; a one- or two-sentence
    overview; ## Configuration (Field, Type, Description);
    ## Exported Members (Name, Description); ## Usage with Standalone
    and With fx subsections; ## Test Helpers when testing/<module>test
    exists.
  - Exported Members lists every exported symbol the module commits
    to: types, functions, constants, methods (qualified, as in
    Client.Do) and struct fields that are part of the API. Config
    fields stay in Configuration.
  - A change that adds, removes or renames an export updates the README
    in the same PR. A new module adds a row to the root README Modules
    table (alphabetical) and registers in go.work.
  - Markdown tables, repo-wide: no backticks in cells; header,
    separator and body rows have the same column count.
  - READMEs say how to use a module. docs/<topic>.md says why a
    cross-module pattern or non-obvious trade-off exists.

  Specs:
  - One spec per module, at openspec/specs/<package>/spec.md, named
    after the module's package (openspec/specs/configloader). Specs
    for anything else use kebab-case folder names (release-ci).
  - Specs hold the behavioural guarantees a module makes to consumers.
    Project-wide patterns live in this block, not in per-module specs.
  - A testing/<module>test package is specced only when consumers
    depend on its behaviour.

rules:
  proposal:
    - Under Impact, name every module the change touches and say, for
      each, whether its exported API changes or only its internals.
    - For a new module, state its exposure shape(s) and whether it has
      a Module, a Config and a runner.
  design:
    - Name any new dependency and why it beats hand-rolled code. Put a
      heavy optional dependency behind a subpackage.
    - Flag durable rationale for rollup into docs/<topic>.md at
      archive; design.md is a discussion surface, not its final home.
  tasks:
    - One VERSION bump task per touched module, stating patch, minor
      or major. Skip modules the change creates; they start at their
      first version.
    - A README task for each module whose exports or Config change.
      A new module also gets tasks for its root README row and its
      go.work registration.
    - A go generate ./... task for each module whose mocked interfaces
      change, before verification.
    - A verification task per touched module running the constitution's
      chain (modernize -fix, golangci-lint run --fix, a no-fix lint
      re-run if files changed, the full go test ./..., then
      govulncheck ./...).
    - Then a task running go test -short ./... across every module. If
      it fails, fix and repeat both verification steps until it
      passes.
    - >
      Tasks are the work done on the branch before review: code, tests,
      docs and the verification chain. Steps outside the branch aren't
      tasks: opening or merging the pull request, watching CI, checking
      a published release, consumer checks after merge, and repository
      settings. CI and the release tooling enforce most of them, and an
      unticked one would hold the change back from archiving. Note any
      that need saying in design.md's Migration Plan. When a task has
      to wait for one, such as a sibling's release, say so in the task.
  specs:
    - Use SHALL/MUST/MAY (RFC 2119) for normative requirements.
    - Each requirement has at least one scenario, headed with exactly
      four hashtags (#### Scenario:).
    - Keep requirements behavioural, from the consumer's side. Don't
      restate the exported API; the README and go doc cover it.

operations:
  archive:
    guidance:
      - Before archiving, record in design.md what actually happened,
        covering deviations from the design, fixes made in review and
        follow-ups left open.
      - Roll durable rationale from design.md into docs/<topic>.md.
